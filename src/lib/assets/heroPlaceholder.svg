<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#0f172a" />
			<stop offset="100%" stop-color="#1e1b4b" />
		</linearGradient>
		<radialGradient id="blob1" cx="50%" cy="50%" r="50%">
			<stop offset="0%" stop-color="#818cf8" stop-opacity="0.55" />
			<stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
		</radialGradient>
		<radialGradient id="blob2" cx="50%" cy="50%" r="50%">
			<stop offset="0%" stop-color="#c084fc" stop-opacity="0.5" />
			<stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
		</radialGradient>
		<radialGradient id="blob3" cx="50%" cy="50%" r="50%">
			<stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35" />
			<stop offset="100%" stop-color="#22d3ee" stop-opacity="0" />
		</radialGradient>
		<filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
			<feGaussianBlur stdDeviation="60" />
		</filter>
	</defs>
	<rect width="1280" height="720" fill="url(#bg)" />
	<g filter="url(#blur)">
		<circle cx="280" cy="220" r="260" fill="url(#blob1)" />
		<circle cx="920" cy="180" r="300" fill="url(#blob2)" />
		<circle cx="700" cy="560" r="340" fill="url(#blob3)" />
	</g>
</svg>
