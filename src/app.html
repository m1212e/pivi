<!doctype html>

<html lang="%paraglide.lang%" dir="%paraglide.dir%" data-perf="%pivi.perf%">
	<head>
		<meta charset="utf-8" />

		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark" />
		<!-- The shell's background before any stylesheet loads, so the kiosk's
		     hand-over from its splash screen (nix/kiosk-splash.html) never
		     flashes white. Same slate-950 as layout.css. -->
		<style>
			html {
				background: #020617;
			}
		</style>

		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
