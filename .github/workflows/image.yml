name: SD image

# Builds the flashable Raspberry Pi images and attaches them to the release.
#
# Release-only, not per-push: each image is a full NixOS system closure plus a
# SvelteKit build, which is on the order of a gigabyte and tens of minutes. It
# is not something to pay for on every commit.
on:
  release:
    types: [published]
  # `npm version` tags the release, so a tag push is the trigger that actually
  # fires in practice; the release is created below if it doesn't exist yet.
  push:
    tags: ['v*']
  # So an image can be rebuilt without cutting a new release — for a failed
  # upload, or to test a change to this workflow.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach the images to (blank = build only)'
        required: false
        type: string

permissions:
  contents: write # attaching assets to the release

jobs:
  image:
    strategy:
      # One image per board: each Pi generation needs its own device trees and
      # initrd modules (see nixos-hardware's per-generation modules), so no image
      # boots another's hardware. The Pi 3 is the weakest of the three — see the
      # note in flake.nix.
      fail-fast: false
      matrix:
        board: [pi3, pi4, pi5]

    # A native arm64 runner, so the aarch64 closure builds without emulation —
    # under QEMU this takes hours rather than minutes. These runners are free
    # for public repositories; on a private repo they need a paid plan, in
    # which case swap in `ubuntu-latest` plus a QEMU step:
    #
    #   - uses: docker/setup-qemu-action@v3
    #   - run: echo "extra-platforms = aarch64-linux" | sudo tee -a /etc/nix/nix.conf
    #
    # and expect it to be very slow.
    runs-on: ubuntu-24.04-arm

    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # A release built from unpinned inputs isn't reproducible: rebuilding the
      # same tag later can produce a different system. This warns rather than
      # fails so a first release isn't blocked on it, but the lock file should
      # be committed.
      - name: Check inputs are pinned
        run: |
          if [ ! -f flake.lock ]; then
            echo "::warning::No flake.lock committed — this image is built from whatever nixpkgs resolves to right now, and is not reproducible. Run 'nix flake lock' and commit the result."
          fi

      # Cheap and worth having on every run: nix reports what it would fetch from
      # the binary cache versus what it has to compile, in seconds. An image that
      # suddenly needs a kernel or a browser built from source goes from ~10
      # minutes to hours, and this is what says so up front instead of leaving it
      # to be inferred from a job that just sits there.
      # Same reasoning as in nix.yml: build the fixed-output dependency trees
      # first so one run reports every aarch64 hash that needs updating, rather
      # than the image build stopping at the first mismatch.
      - name: Check the dependency hashes
        run: |
          status=0
          for tree in nodeModules prodNodeModules; do
            nix build ".#pivi.$tree" --no-link --print-build-logs || status=1
          done
          exit $status

      - name: Report what must be built vs fetched
        run: |
          nix build .#sd-image-${{ matrix.board }} --dry-run 2>&1 | tail -60

      - name: Build the image
        run: nix build .#sd-image-${{ matrix.board }} --print-build-logs

      # The sd-image module writes a compressed image under sd-image/ with a
      # name of its own choosing (it carries the nixpkgs version and
      # architecture), so the path is discovered rather than assumed.
      # Where the size actually goes. The image has been stuck just over GitHub's
      # 2 GiB asset limit, and trimming by intuition has a poor record here — the
      # kernel, not the browser, turned out to be the 90-minute build. This is the
      # same measurement applied to size.
      - name: Report the largest closure entries
        run: |
          nix path-info -rSh \
            ".#nixosConfigurations.${{ matrix.board }}.config.system.build.toplevel" \
            2>/dev/null | sort -hk2 | tail -25 || echo "(closure report unavailable)"

      - name: Locate and name the image
        id: image
        run: |
          set -euo pipefail
          built=$(find -L result/sd-image -name '*.img.zst' -print -quit)
          if [ -z "$built" ]; then
            echo "No .img.zst found under result/sd-image:" >&2
            find -L result -maxdepth 2 >&2
            exit 1
          fi

          tag="${{ github.event.release.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || inputs.tag }}"
          name="pivi-${tag:-dev}-${{ matrix.board }}.img.zst"
          cp "$built" "$name"
          echo "path=$name" >> "$GITHUB_OUTPUT"
          ls -lh "$name"

      # Kept even when there's no release to attach to (a plain
      # workflow_dispatch), so a manual build is still downloadable.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.image.outputs.path }}
          path: ${{ steps.image.outputs.path }}
          compression-level: 0 # already zstd-compressed
          retention-days: 7

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || inputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "$TAG" ]; then
            echo "No release tag given — image left as a workflow artifact only."
            exit 0
          fi
          # A bare tag push (what `npm version && git push --follow-tags` does)
          # has no release behind it yet. Both boards run this, so it has to
          # tolerate the other one having just created it.
          # GitHub rejects release assets over 2 GiB (HTTP 422). The image is
          # already uploaded as a workflow artifact by the step above, which has
          # no such limit, so an oversized image is worth a loud warning rather
          # than failing a build that otherwise succeeded.
          size=$(stat -c %s "${{ steps.image.outputs.path }}")
          limit=$((2 * 1024 * 1024 * 1024))
          if [ "$size" -ge "$limit" ]; then
            echo "::warning::${{ steps.image.outputs.path }} is $((size / 1024 / 1024)) MiB, over GitHub's 2 GiB release-asset limit — attached to this run as an artifact instead. Shrink the image (see DEPLOYMENT.md) to attach it to the release."
            exit 0
          fi

          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --generate-notes ||
            gh release view "$TAG" >/dev/null
          gh release upload "$TAG" "${{ steps.image.outputs.path }}" --clobber
