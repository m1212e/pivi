name: Nix

# Catches packaging breakage on the PR that causes it, rather than at release
# time when the only signal is a failed image build.
#
# The images themselves are deliberately not built here — that's a full system
# closure per board, far too slow for a PR. What this does instead is cheaper
# and catches most of the same mistakes: evaluate every flake output (including
# both Pi configurations, which is where a bad option name or a typo in the
# module surfaces) and actually build the app package.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push supersedes whatever was already running for the same branch.
concurrency:
  group: nix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Evaluation only. `--no-build` matters on an x86_64 runner: the flake
      # also exposes aarch64 images, which this machine can evaluate but not
      # build. Evaluating the two nixosConfigurations is the valuable part —
      # it type-checks every option the module and nix/image.nix set, and a
      # misspelled option or a malformed attribute fails here.
      - name: Evaluate the flake
        run: nix flake check --no-build --print-build-logs

      # The real thing, natively: dependencies, svelte-kit build, wrappers.
      #
      # Note this fails until the fixed-output hash in nix/package.nix is a real
      # one — `lib.fakeHash` is a placeholder that only the first local build
      # can replace (see DEPLOYMENT.md).
      - name: Build the package
        run: nix build .#pivi --print-build-logs

      # A build that succeeds but produces something unrunnable is worth
      # catching here too: these are the two entry points the systemd unit
      # invokes, and the layout they depend on (build/ and plugins/ as
      # siblings, node_modules beside them) is easy to break from the install
      # phase without any of the above noticing.
      - name: Check the result is shaped as expected
        run: |
          set -euo pipefail
          test -x result/bin/pivi-server
          test -x result/bin/pivi-db-push
          test -f result/share/pivi/build/handler.js
          test -d result/share/pivi/plugins/youtube
          test -d result/share/pivi/node_modules
          echo "OK"
