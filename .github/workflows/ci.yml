name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://pivi@localhost/pivi
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # src/lib/paraglide is generated (by the Vite plugin during dev and build) and
      # gitignored, so a fresh checkout has none of the messages and runtime that
      # half the app imports. Compile it before anything type-checks or tests.
      - run: bunx paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide --silent
      - run: bun run check
      - run: bun run lint
      - run: bun run sdk:check
      - run: bun run cli:check
      - run: bunx vitest --run --project server
