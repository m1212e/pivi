name: App protocol schema

# Attaches app-protocol.schema.json to the release. It is generated from the zod
# schemas in sdk/, which is what apps written in other languages
# implement against.
on:
  release:
    types: [published]
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach the schema to (blank = build only)'
        required: false
        type: string

permissions:
  contents: write # attaching assets to the release

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run apps:protocol build/app-protocol.schema.json

      - uses: actions/upload-artifact@v4
        with:
          name: app-protocol.schema.json
          path: build/app-protocol.schema.json

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || inputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "$TAG" ]; then
            echo "No release tag given, schema left as a workflow artifact only."
            exit 0
          fi
          # Tag pushes have no release yet, and image.yml may be creating it
          # at the same moment.
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --generate-notes ||
            gh release view "$TAG" >/dev/null
          gh release upload "$TAG" build/app-protocol.schema.json --clobber
