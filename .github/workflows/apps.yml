name: App images

# The apps under apps/, built and published with the pivi-app CLI (packages/cli):
# each is bundled with tsdown and built from its Containerfile with buildah, for
# linux/amd64 and linux/arm64. Pull requests only check that they build. Pushes
# to main publish ghcr.io/<owner>/<repo>/pivi-<id>:main, version tags publish
# :<version> and :latest (what an untagged suggested app follows).
on:
  pull_request:
    paths: ['apps/**', 'packages/**', 'scripts/apps.ts', '.github/workflows/apps.yml']
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.list.outputs.apps }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: |
          echo "apps=$(find apps -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  image:
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.discover.outputs.apps) }}
    env:
      APP: apps/${{ matrix.app }}
      # The runner has podman too: build with buildah, as the generated projects do.
      PIVI_BUILDER: buildah
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      # RUN steps in a Containerfile (YouTube's yt-dlp) run under QEMU for arm64.
      - uses: docker/setup-qemu-action@v4
      - run: buildah --version
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: ${{ env.APP }}

      - if: github.event_name == 'pull_request'
        run: bun run pivi-app build "$APP"

      - if: github.event_name != 'pull_request'
        env:
          PIVI_REGISTRY_USERNAME: ${{ github.actor }}
          PIVI_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}/pivi-$(jq -r .id "$APP/manifest.json")"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            # The manifest's version and latest.
            bun run pivi-app publish "$APP" "$image"
          else
            bun run pivi-app publish "$APP" "$image:main"
          fi
