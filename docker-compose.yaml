services:
  db:
    image: postgres
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: local
    volumes:
      - pgdata:/var/lib/postgresql

  # Self-hosted Invidious — the YouTube plugin's browse/search data source
  # (see plugins/youtube/invidious.ts). Talking to InnerTube directly for
  # these hit a wall: WEB-client content endpoints reject OAuth-only auth,
  # and the client that does accept it (TV) returns responses in a shape
  # nothing in youtubei.js can parse. Invidious already does that
  # reverse-engineering work itself and exposes a plain REST API instead.
  invidious:
    image: quay.io/invidious/invidious:latest
    restart: unless-stopped
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      INVIDIOUS_CONFIG: |
        db:
          dbname: invidious
          user: kemal
          password: kemal
          host: invidious-db
          port: 5432
        check_tables: true
        invidious_companion:
        - private_url: "http://invidious-companion:8282/companion"
        invidious_companion_key: "${INVIDIOUS_COMPANION_KEY}"
        hmac_key: "${INVIDIOUS_HMAC_KEY}"
    healthcheck:
      test: wget -nv --tries=1 --spider http://127.0.0.1:3000/api/v1/stats || exit 1
      interval: 30s
      timeout: 5s
      retries: 2
    depends_on:
      - invidious-db

  invidious-companion:
    image: quay.io/invidious/invidious-companion:latest
    restart: unless-stopped
    environment:
      SERVER_SECRET_KEY: '${INVIDIOUS_COMPANION_KEY}'
    cap_drop:
      - ALL
    read_only: true
    volumes:
      - invidious-companion-cache:/var/tmp/youtubei.js:rw
    security_opt:
      - no-new-privileges:true

  invidious-db:
    image: docker.io/library/postgres:14
    restart: unless-stopped
    volumes:
      - invidious-pgdata:/var/lib/postgresql/data
      - ./vendor/invidious/config/sql:/config/sql
      - ./vendor/invidious/docker/init-invidious-db.sh:/docker-entrypoint-initdb.d/init-invidious-db.sh
    environment:
      POSTGRES_DB: invidious
      POSTGRES_USER: kemal
      POSTGRES_PASSWORD: kemal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']

volumes:
  pgdata:
  invidious-pgdata:
  invidious-companion-cache:
